<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Álbum de Figurinhas IA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ======================================================
         CABEÇALHO
         ====================================================== -->

    <header>

        <h1>
            Álbum de Figurinhas IA
        </h1>

        <p>
            Uma coleção especial sobre Inteligência Artificial,
            Python, Banco de Dados e Tecnologia.
        </p>

    </header>


    <!-- ======================================================
         CAPA FECHADA
         ====================================================== -->

    <main>

        <div
            id="capa"
            class="capa"
            title="Clique para abrir o álbum"
        >

            <div class="capa-borda">

                <div class="capa-conteudo">

                    <div class="capa-icone">
                        ★
                    </div>

                    <h2>
                        ÁLBUM
                    </h2>

                    <h3>
                        DE FIGURINHAS
                    </h3>

                    <div class="capa-linha"></div>

                    <p>
                        INTELIGÊNCIA ARTIFICIAL
                    </p>

                    <span>
                        TECNOLOGIA • PROGRAMAÇÃO • INOVAÇÃO
                    </span>

                    <div class="capa-abrir">
                        Clique para abrir
                    </div>

                </div>

            </div>

        </div>


        <!-- ==================================================
             ÁLBUM ABERTO
             ================================================== -->

        <div
            id="album-container"
            class="album-container fechado"
        >

            <div
                id="album"
                class="album"
            >

                <!-- Página esquerda -->
                <div
                    id="pagina-esquerda"
                    class="pagina pagina-esquerda"
                >
                </div>


                <!-- Página direita -->
                <div
                    id="pagina-direita"
                    class="pagina pagina-direita"
                >
                </div>

            </div>


            <!-- ==================================================
                 CONTROLES
                 ================================================== -->

            <div class="controles">

                <button
                    id="btn-anterior"
                    type="button"
                >
                    ◀ Anterior
                </button>

                <span id="pagina-atual">
                    Páginas 1–2 de 7
                </span>

                <button
                    id="btn-proxima"
                    type="button"
                >
                    Próxima ▶
                </button>

            </div>

        </div>

    </main>


    <!-- ======================================================
         RODAPÉ
         ====================================================== -->

    <footer>

        <p>
            Álbum de Figurinhas IA
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
